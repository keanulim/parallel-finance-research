apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-agents
  template:
    metadata:
      labels:
        app: finance-agents
    spec:
      containers:
        - name: finance-agents
          image: finance-research-agents:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: finance-agents-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
